name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm test

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium

      - name: Recording and playback integrity
        run: |
          npm run test:recording
          npm run test:recording:api
          npm run test:playback
          npm run test:playback:browser

      - name: RTSP recording and reconnect
        run: |
          curl -fL https://github.com/bluenviron/mediamtx/releases/download/v1.9.0/mediamtx_v1.9.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/mediamtx.tar.gz"
          tar -xzf "$RUNNER_TEMP/mediamtx.tar.gz" -C "$RUNNER_TEMP" mediamtx
          MEDIAMTX_BIN="$RUNNER_TEMP/mediamtx" npm run test:recording:rtsp
          MEDIAMTX_BIN="$RUNNER_TEMP/mediamtx" npm run test:legacy-rtsp:integration

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
