<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update läuft - ONVIFscanner NVR</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #020617;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #1e293b;
      border-bottom-color: #6366f1;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-bottom: 2rem;
    }
    .logo {
      width: 112px;
      height: 112px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #f8fafc;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <img class="logo" src="/logo.png" alt="ONVIFscanner NVR">
  <span class="loader"></span>
  <h1>Wartungsarbeiten / Update läuft</h1>
  <p>ONVIFscanner NVR wird gerade aktualisiert oder neu gestartet. Bitte habe einen Moment Geduld.</p>
  <p id="status" style="font-size: 0.875rem; margin-top: 1rem;">Diese Seite prüft automatisch im Hintergrund, ob das System wieder erreichbar ist.</p>

  <script>
    let successfulChecks = 0;
    const status = document.getElementById('status');

    async function checkServer() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 4000);
      try {
        const response = await fetch('/api/version?update=' + Date.now(), {
          cache: 'no-store',
          headers: { 'cache-control': 'no-cache' },
          signal: controller.signal
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        successfulChecks += 1;
        status.textContent = 'Dienst ist wieder erreichbar. Oberfläche wird geladen…';
        if (successfulChecks >= 2) window.location.replace('/?updated=' + Date.now());
      } catch (error) {
        successfulChecks = 0;
        status.textContent = 'Update läuft. Der automatische Neustart wird abgewartet…';
      } finally {
        clearTimeout(timeout);
      }
    }

    setInterval(checkServer, 3000);
    checkServer();
  </script>
</body>
</html>
