<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update läuft - ONVIFscanner</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #020617;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #1e293b;
      border-bottom-color: #6366f1;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
      margin-bottom: 2rem;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #f8fafc;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <span class="loader"></span>
  <h1>Wartungsarbeiten / Update läuft</h1>
  <p>ONVIFscanner wird gerade aktualisiert oder neu gestartet. Bitte habe einen Moment Geduld.</p>
  <p style="font-size: 0.875rem; margin-top: 1rem;">Diese Seite prüft automatisch im Hintergrund, ob das System wieder erreichbar ist.</p>

  <script>
    // Alle 3 Sekunden prüfen, ob die API wieder antwortet
    setInterval(() => {
      fetch('/api/version', { cache: 'no-store' })
        .then(res => {
          if (res.ok) {
            window.location.href = '/';
          }
        })
        .catch(err => {
          // Weiter warten
        });
    }, 3000);
  </script>
</body>
</html>
